# Non-secret settings. Secrets (GROQ_API_KEY, DATABASE_URL, MCP_AUTH_SECRET, LANGFUSE_*) go in a Secret named orbitdesk-secrets:
#   kubectl create secret generic orbitdesk-secrets --from-env-file=.env
apiVersion: v1
kind: ConfigMap
metadata:
  name: orbitdesk-config
data:
  REDIS_URL: redis://redis:6379/0
  VECTOR_BACKEND: auto     # pgvector when DATABASE_URL (from the secret) is set
  QUEUE_MODE: rq
  PROMPT_VERSION: v1       # rollback lever: change + `kubectl rollout restart deploy/orbitdesk-api`
  ROUTER_MODE: prompt
  INGEST_ON_STARTUP: "true"
  DATA_DIR: /var/orbitdesk
