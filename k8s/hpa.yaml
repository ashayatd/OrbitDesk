# Scale the API on CPU: the cross-encoder rerank (~150 ms CPU per query) is the CPU-bound stage.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: orbitdesk-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: orbitdesk-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
