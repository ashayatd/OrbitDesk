# API deployment (stateless except SQLite, see note) + worker deployment.
# Postgres (with pgvector) and Redis run as their own services and are not defined here; DATABASE_URL comes
# from the orbitdesk-secrets Secret. API replicas are stateless (sessions in Redis, MCP is stateless HTTP).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbitdesk-api
  labels: {app: orbitdesk, component: api}
spec:
  replicas: 2
  selector:
    matchLabels: {app: orbitdesk, component: api}
  template:
    metadata:
      labels: {app: orbitdesk, component: api}
    spec:
      containers:
        - name: api
          image: orbitdesk:latest
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports: [{containerPort: 8000}]
          envFrom:
            - configMapRef: {name: orbitdesk-config}
            - secretRef: {name: orbitdesk-secrets, optional: true}
          resources:
            requests: {cpu: 500m, memory: 1536Mi}
            limits: {cpu: "2", memory: 3Gi}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 60
            periodSeconds: 20
          volumeMounts: [{name: data, mountPath: /var/orbitdesk}]
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbitdesk-worker
  labels: {app: orbitdesk, component: worker}
spec:
  replicas: 1
  selector:
    matchLabels: {app: orbitdesk, component: worker}
  template:
    metadata:
      labels: {app: orbitdesk, component: worker}
    spec:
      containers:
        - name: worker
          image: orbitdesk:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "worker.py"]
          envFrom:
            - configMapRef: {name: orbitdesk-config}
            - secretRef: {name: orbitdesk-secrets, optional: true}
          resources:
            requests: {cpu: 250m, memory: 1Gi}
            limits: {cpu: "1", memory: 2Gi}
          volumeMounts: [{name: data, mountPath: /var/orbitdesk}]
      volumes:
        - name: data
          emptyDir: {}
