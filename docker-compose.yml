# Local multi-service run: api, worker, redis and postgres (with pgvector).
#   docker compose up --build        ->  http://localhost:8000/ui   (MCP: http://localhost:8000/mcp/)
# Postgres holds employees, leave, tickets, pending actions, logs AND the vectors (pgvector) + full-text
# index, so hybrid search runs inside one database. The api ingests data/docs at startup (unchanged docs
# are skipped by content hash).
services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  postgres:
    image: pgvector/pgvector:pg17   # Postgres 17 + the pgvector extension
    environment:
      POSTGRES_USER: orbit
      POSTGRES_PASSWORD: orbit       # local demo only; use a secret in any shared environment
      POSTGRES_DB: orbitdesk
    volumes:
      - pg-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbit -d orbitdesk"]
      interval: 5s
      retries: 20

  api:
    build: .
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:   # the image's HEALTHCHECK targets the Space port 7860
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:8000/health"]
      interval: 15s
      start_period: 60s
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment: &app-env
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+psycopg://orbit:orbit@postgres:5432/orbitdesk
      VECTOR_BACKEND: auto          # -> pgvector, because DATABASE_URL is set
      QUEUE_MODE: rq
      MCP_URL: http://127.0.0.1:8000/mcp/
      DATA_DIR: /var/orbitdesk     # uploads only (all records live in Postgres)
    volumes:
      - app-data:/var/orbitdesk
    depends_on:
      redis: {condition: service_healthy}
      postgres: {condition: service_healthy}

  worker:
    build: .
    command: ["python", "worker.py"]
    healthcheck:   # no HTTP server in the worker: check its Redis connection instead
      test: ["CMD", "python", "-c", "import redis,os; redis.Redis.from_url(os.environ['REDIS_URL']).ping()"]
      interval: 30s
    env_file:
      - path: .env
        required: false
    environment: *app-env
    volumes:
      - app-data:/var/orbitdesk
    depends_on:
      redis: {condition: service_healthy}
      postgres: {condition: service_healthy}

volumes:
  pg-data:
  app-data:
