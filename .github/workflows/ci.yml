name: ci

# lint -> tests -> retrieval eval gate -> docker build -> deploy to the Hugging Face Space.
# Deploys on pushes to main and on v* tags. Rollback = run this workflow manually with
# `ref` set to an older tag (see docs/DEPLOY.md).
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (tag/sha) to deploy, e.g. v0.3.0 for a rollback"
        required: true
        default: main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.8.x"
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ inputs.ref || github.sha }}"}
      - uses: astral-sh/setup-uv@v6
        with: {version: "${{ env.UV_VERSION }}", python-version: "${{ env.PYTHON_VERSION }}", enable-cache: true}
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ inputs.ref || github.sha }}"}
      - uses: astral-sh/setup-uv@v6
        with: {version: "${{ env.UV_VERSION }}", python-version: "${{ env.PYTHON_VERSION }}", enable-cache: true}
      - run: uv sync --frozen
      # No API keys in CI on purpose: the suite must pass with every key empty.
      - run: uv run pytest -q

  eval-gate:
    # Fails the build if recall@5 / MRR regress below evals/gate.json or ANY access-control leak appears.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ inputs.ref || github.sha }}"}
      - uses: astral-sh/setup-uv@v6
        with: {version: "${{ env.UV_VERSION }}", python-version: "${{ env.PYTHON_VERSION }}", enable-cache: true}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ hashFiles('app/config.py') }}
      - run: uv sync --frozen
      - name: Retrieval eval + leak test (no API key needed)
        env: {REDIS_URL: "fakeredis://"}
        run: uv run python evals/retrieval_eval.py --gate
      - name: Every number quoted in the docs exists in reports/
        run: uv run python scripts/check_doc_numbers.py
      - uses: actions/upload-artifact@v4
        with: {name: retrieval-eval, path: reports/retrieval_eval.json}

  docker:
    runs-on: ubuntu-latest
    needs: [lint, test, eval-gate]
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ inputs.ref || github.sha }}"}
      - uses: docker/setup-buildx-action@v3
      - name: Build image (same Dockerfile the Space builds)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: orbitdesk:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: "Smoke test the container (no keys: /health up, /ask returns 503, /search works)"
        run: |
          docker run -d --name od -p 7860:7860 orbitdesk:ci
          for i in $(seq 1 60); do curl -fs localhost:7860/health && break; sleep 2; done
          curl -fs localhost:7860/health | grep '"llm_available":false'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:7860/ask -H 'content-type: application/json' -d '{"question":"hi","session_id":"ci"}')" = "503"
          curl -fs -X POST localhost:7860/search -H 'content-type: application/json' -d '{"query":"VPN-809","role":"employee"}' | grep vpn-setup
          docker logs od | tail -20

  deploy:
    # Needs repo secret HF_TOKEN (write) and repo variable HF_SPACE_ID (e.g. "your-name/orbitdesk").
    runs-on: ubuntu-latest
    needs: [docker]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    environment: production
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ inputs.ref || github.sha }}"}
      - name: Check deploy settings
        env: {HF_TOKEN: "${{ secrets.HF_TOKEN }}", HF_SPACE_ID: "${{ vars.HF_SPACE_ID }}"}
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE_ID" ]; then
            echo "::warning::HF_TOKEN secret or HF_SPACE_ID variable not set; skipping deploy"; echo "SKIP=1" >> $GITHUB_ENV
          fi
      - name: Upload to the Space (the Space builds the root Dockerfile)
        if: env.SKIP != '1'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
          DEPLOY_REF: ${{ inputs.ref || github.ref_name }}
        run: |
          pip install -q "huggingface_hub>=0.25"
          cp docker/space_README.md README.md   # Spaces read their config from README front matter
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          HfApi(token=os.environ["HF_TOKEN"]).upload_folder(
              repo_id=os.environ["HF_SPACE_ID"], repo_type="space", folder_path=".",
              commit_message=f"deploy {os.environ['DEPLOY_REF']} ({os.environ['GITHUB_SHA'][:7]})",
              ignore_patterns=[".git/*", ".github/*", "mlruns/*", "finetune/outputs/*", "data/chroma/*",
                               "data/*.db", "evals/.checkpoints/*", "evals/.judge_cache/*", "k8s/*"],
              delete_patterns=["*"],  # make the Space an exact copy of this ref (clean rollbacks)
          )
          PY
