[project]
name = "orbitdesk"
version = "0.1.0"
description = "Enterprise helpdesk copilot for the fictional Orbit Systems: RAG + agent + guardrails + evals"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    # API + UI
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.1",
    "gradio>=5.0",
    "httpx>=0.27",
    # LLM + agent
    "langchain-core>=0.3",
    "langchain-groq>=0.2",
    "langchain-openai>=0.2",
    "langgraph>=0.2",
    "groq>=0.11",
    "openai>=1.40",
    # Retrieval
    "torch>=2.3",
    "sentence-transformers>=3.0",
    "chromadb>=0.5",
    "faiss-cpu>=1.8",
    "rank-bm25>=0.2.2",
    "numpy>=1.26",
    # Ingestion
    "pypdf>=4.3",
    "pyyaml>=6.0",
    # Infra
    "redis>=5.0",
    "rq>=1.16",
    "structlog>=24.1",
    "tenacity>=8.5",
    # Observability
    "langfuse>=2.50",
    # Database (Phase 8b): SQLAlchemy Core works with SQLite and Postgres
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "sqlglot>=25",  # parses LLM-written SQL for the text-to-SQL validator
    # MCP (Phase 8b)
    "mcp>=1.20",
    "langchain-mcp-adapters>=0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "fakeredis[lua]>=2.24",
    "ruff>=0.6",
    "reportlab>=4.2",
]
llamaindex = [
    "llama-index-core>=0.12",
]
eval = [
    "llama-index-core>=0.12",
    "ragas>=0.4.3",
    "datasets>=2.20",
    "mlflow-skinny>=3.0",
    "alembic>=1.13",  # MLflow's SQLite backend (the plain file store is in maintenance mode)
]
finetuned = [
    # runtime: ROUTER_MODE=finetuned loads the LoRA adapter on CPU
    "peft>=0.12",
]
finetune = [
    # training (Colab T4). bitsandbytes (4-bit QLoRA) is installed in the notebook: it needs CUDA.
    "peft>=0.12",
    "trl==1.14.2",  # 1.15 forces a Triton-only fused LM head (Linux only); the notebook pins the same version
    "accelerate>=1.0",
    "datasets>=2.20",
    "scikit-learn>=1.4",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["finetune/*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = [
    "B008",   # FastAPI Depends() in defaults is idiomatic
    "SIM905", # "a b c".split() is clearer than a long list literal for word lists
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "needs_llm: requires GROQ_API_KEY (skipped otherwise)",
    "slow: loads local ML models",
    "postgres: needs TEST_DATABASE_URL (a Postgres with pgvector); skipped otherwise",
]

[tool.ruff.lint.per-file-ignores]
"evals/render_results.py" = ["E501"]  # long prose sentences in f-strings read better unwrapped
